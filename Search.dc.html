<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shop Zetu — Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #FFFFFF; font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #0B0B0C">
<dc-import name="Header" demo="search" embedded="1" mob="{{ mob }}" count="3" hint-size="100%,164px"></dc-import>
<div aria-hidden="true" style="background: #0B0B0C; height: 620px; padding: 64px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<span style="width: 260px; height: 12px; background: #DDEA0D; display: block"></span>
<span style="width: 620px; max-width: 80%; height: 140px; border-radius: 8px; background: #1F1F22; display: block"></span>
<span style="width: 420px; max-width: 70%; height: 16px; border-radius: 4px; background: #1F1F22; display: block"></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mob":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { mob: this.props.mob ? '1' : '' };
  }
}
</script>
</body>
</html>
